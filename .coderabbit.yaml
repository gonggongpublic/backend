# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.next/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        기관별 데이터 격리와 권한 검사를 확인합니다. 요청의 기관 ID를 그대로 신뢰하는지, QR 출입증의 만료·폐기·재사용 처리가 테스트로 검증되는지 살핍니다. 로그에 출입증 원문이나 개인정보가 남는지도 확인합니다.
chat:
  auto_reply: true
