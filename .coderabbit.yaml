# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.next/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        테넌트가 필요한 API와 데이터 조회·변경에서 인증된 사용자의 소속과 권한을 서버가 확인하는지 검토하세요.
        요청 경로·헤더·본문의 기관 ID만으로 접근을 허용하거나, 예약·출입증 ID만으로 다른 테넌트의 데이터에 접근할 수 있는 변경을 지적하세요.
        방문 승인·출입증 발급·폐기·게이트 검증은 팀이 정한 권한과 상태 전이를 따르는지 확인하세요.
        만료·폐기된 QR과 동시에 들어온 중복 검증 요청의 처리 결과를 테스트하는지 살피고, 로그와 오류 응답에 QR 원문·토큰·개인정보가 남으면 지적하세요.
        API나 이벤트 계약이 바뀌면 관리자 웹·모바일 앱·게이트 시뮬레이터에 미치는 영향을 확인하세요.
chat:
  auto_reply: true
